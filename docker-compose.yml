services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_URL=${LLM_API_URL:-https://api-inference.modelscope.cn/v1}
      - LLM_MODEL=${LLM_MODEL:-Qwen/Qwen3-30B-A3B-Instruct-2507}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-small-zh-v1.5}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - WEATHER_SUBSCRIPTION_ID=${WEATHER_SUBSCRIPTION_ID:-}
      - AMAP_API_KEY=${AMAP_API_KEY:-}
    restart: unless-stopped
