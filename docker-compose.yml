services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7860:7860"
    environment:
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_API_URL=${LLM_API_URL:-https://api-inference.modelscope.cn/v1}
      - LLM_MODEL=${LLM_MODEL:-Qwen/Qwen3.8-27B}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-small-zh-v1.5}
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      - WEATHER_SUBSCRIPTION_ID=${WEATHER_SUBSCRIPTION_ID:-}
      # 访问形态：默认免登录（共享 guest 桶），设成 true 恢复登录门槛
      - AUTH_REQUIRED=${AUTH_REQUIRED:-false}
      - GUEST_USER_ID=${GUEST_USER_ID:-guest}
    restart: unless-stopped
